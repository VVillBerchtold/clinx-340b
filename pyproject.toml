[project]
name = "filings340b"
version = "0.4.0"
description = "State 340B covered entity filings as structured, source-cited open data."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Will Berchtold" }]
dependencies = []

[project.scripts]
filings340b = "filings340b.cli:main"

[dependency-groups]
dev = ["mypy==2.4.1", "pytest==9.2.0", "ruff==0.17.4"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings340b"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF", "PL", "S", "ANN", "D"]
ignore = ["D203", "D213", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D", "ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
